spring:
  application:
    name: spring-starter-kit
  profiles:
    # 활성 프로파일 미지정 시 local 로 동작. 운영은 SPRING_PROFILES_ACTIVE=prod 를 명시한다.
    default: local

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 매핑-스키마 일치 검증만 수행.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.example.starter: DEBUG
