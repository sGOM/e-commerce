spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

server:
  servlet:
    session:
      cookie:
        # 운영은 HTTPS 전제 — 보안 쿠키 강제
        secure: true

logging:
  level:
    com.example.starter: INFO
