spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

server:
  servlet:
    session:
      cookie:
        # 운영은 HTTPS 전제 — 보안 쿠키 강제
        secure: true

# API 문서는 개발용 — 운영에서는 엔드포인트 목록이 공개되지 않도록 끈다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.example.starter: INFO
